events { worker_connections 1024; }

http {
  upstream gateway {
    server gateway:3000;
    keepalive 32;
  }

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  server {
    listen 80;
    server_name api.taqeem.app;
    # In production with real certificates, this redirects to HTTPS
    # We comment this out for local testing if needed, or assume it works on the VPS
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name api.taqeem.app;

    ssl_certificate     /etc/letsencrypt/live/api.taqeem.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.taqeem.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers (supplement Helmet)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;

    location /api/auth/ {
      limit_req zone=auth burst=20 nodelay;
      proxy_pass         http://gateway;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
      limit_req zone=api burst=200 nodelay;
      proxy_pass         http://gateway;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }
  }
}
