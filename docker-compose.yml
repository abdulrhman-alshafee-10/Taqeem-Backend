version: "3.9"

networks:
  taqeem_network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  es_data:
  timescale_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: taqeem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5434:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [taqeem_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: taqeem_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
    networks: [taqeem_network]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taqeem_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes:
      - redis_data:/data
    networks: [taqeem_network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: taqeem_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks: [taqeem_network]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: taqeem_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks: [taqeem_network]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -E 'yellow|green'"]
      interval: 15s
      timeout: 10s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: taqeem_timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=taqeem_pw
      - POSTGRES_USER=taqeem
      - POSTGRES_DB=taqeem_analytics
    ports: ["5433:5432"]
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [taqeem_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taqeem"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: taqeem_gateway
    restart: unless-stopped
    environment:
      PORT: 3000
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports: ["4000:3000"]
    depends_on:
      - postgres
      - mongo
      - redis
      - rabbitmq
    networks: [taqeem_network]

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: taqeem_user_service
    restart: unless-stopped
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/taqeem_users?schema=public
      JWT_PRIVATE_KEY_PATH: /keys/jwt.key
    ports: ["4001:4001"]
    depends_on:
      - postgres
      - rabbitmq
    volumes:
      - ./jwt.key:/keys/jwt.key:ro
    networks: [taqeem_network]

  business-service:
    build:
      context: .
      dockerfile: services/business-service/Dockerfile
    container_name: taqeem_business_service
    restart: unless-stopped
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/taqeem_businesses?schema=public
    ports: ["4002:4002"]
    depends_on:
      - postgres
      - rabbitmq
    networks: [taqeem_network]

  review-service:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
    container_name: taqeem_review_service
    restart: unless-stopped
    environment:
      PORT: 4003
      MONGO_URI: mongodb://taqeem:taqeem_pw@mongo:27017/taqeem_reviews?authSource=admin
    ports: ["4003:4003"]
    depends_on:
      - mongo
      - rabbitmq
    networks: [taqeem_network]

  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    container_name: taqeem_search_service
    restart: unless-stopped
    environment:
      PORT: 4004
      ES_NODE: http://elasticsearch:9200
    ports: ["4004:4004"]
    depends_on:
      - elasticsearch
      - rabbitmq
    networks: [taqeem_network]

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: taqeem_analytics_service
    restart: unless-stopped
    environment:
      PORT: 4005
      TIMESCALE_URL: postgresql://taqeem:taqeem_pw@timescaledb:5432/taqeem_analytics
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://taqeem:taqeem_pw@rabbitmq:5672
    ports: ["4005:4005"]
    depends_on:
      - timescaledb
      - redis
      - rabbitmq
    networks: [taqeem_network]

  agent-service:
    build:
      context: .
      dockerfile: services/agent-service/Dockerfile
    container_name: taqeem_agent
    restart: unless-stopped
    environment:
      PORT: 4006
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_FAST_MODEL: gpt-4o-mini
      LLM_SMART_MODEL: gpt-4o
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://taqeem:taqeem_pw@rabbitmq:5672
      SEARCH_SERVICE_URL:   http://search-service:4004
      BUSINESS_SERVICE_URL: http://business-service:4002
      REVIEW_SERVICE_URL:   http://review-service:4003
      USER_SERVICE_URL:     http://user-service:4001
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_API_KEY:    ${LANGSMITH_API_KEY:-}
      LANGCHAIN_PROJECT:    taqeem-agent
    depends_on:
      redis:      { condition: service_healthy }
      rabbitmq:   { condition: service_healthy }
    networks: [taqeem_network]

  social-service:
    build:
      context: .
      dockerfile: services/social-service/Dockerfile
    container_name: taqeem_social_service
    restart: unless-stopped
    environment:
      PORT: 4010
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/taqeem_social?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://taqeem:taqeem_pw@rabbitmq:5672
    ports: ["4010:4010"]
    depends_on:
      - postgres
      - rabbitmq
      - redis
    networks: [taqeem_network]

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: taqeem_notification_service
    restart: unless-stopped
    environment:
      PORT: 4008
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/taqeem_notification?schema=public
    ports: ["4008:4008"]
    depends_on:
      - postgres
      - rabbitmq
    networks: [taqeem_network]

  reservation-service:
    build:
      context: .
      dockerfile: services/reservation-service/Dockerfile
    container_name: taqeem_reservation_service
    restart: unless-stopped
    environment:
      PORT: 4007
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/taqeem_reservations?schema=public
      BUSINESS_SERVICE_URL: http://business-service:4002
      RABBITMQ_URL: amqp://taqeem:taqeem_pw@rabbitmq:5672
    ports: ["4007:4007"]
    depends_on:
      - postgres
      - rabbitmq
    networks: [taqeem_network]
